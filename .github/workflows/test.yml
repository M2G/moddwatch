name: test

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install libfswatch (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fswatch

      - name: Install libfswatch (macOS)
        if: runner.os == 'macOS'
        run: brew install fswatch

      - name: go vet
        run: CGO_ENABLED=1 go vet ./...

      - name: go test
        run: CGO_ENABLED=1 go test -race -v ./...